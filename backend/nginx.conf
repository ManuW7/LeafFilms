worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"bytes_sent":$body_bytes_sent,'
            '"duration":$request_time,'
            '"upstream":"$upstream_addr",'
            '"correlation_id":"$http_x_correlation_id"'
        '}';

    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    upstream user_service {
        server host.docker.internal:5001;
    }

    upstream catalogue_service {
        server host.docker.internal:5002;
    }

    upstream review_service {
        server host.docker.internal:5003;
    }

    upstream social_service {
        server host.docker.internal:5004;
    }

    upstream activity_service {
        server host.docker.internal:5005;
    }

    upstream feed_service {
        server host.docker.internal:5006;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        set $correlation_id $http_x_correlation_id;
        if ($correlation_id = "") {
            set $correlation_id $request_id;
        }

        add_header X-Correlation-ID $correlation_id always;

        location /ping {
            return 200 "pong\n";
            add_header Content-Type text/plain;
        }

        # ── UserService ──────────────────────────────────────────────────────
        location /users/ {
            proxy_pass         http://user_service/users/;
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header   X-Correlation-ID $correlation_id;
        }

        # ── CatalogueService ─────────────────────────────────────────────────
        location /movies {
            proxy_pass         http://catalogue_service/movies;
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header   X-Correlation-ID $correlation_id;
        }

        # ── ReviewService ────────────────────────────────────────────────────
        location /reviews {
            proxy_pass         http://review_service/reviews;
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header   X-Correlation-ID $correlation_id;
        }

        # ── SocialService ────────────────────────────────────────────────────
        location /follow {
            proxy_pass         http://social_service/follow;
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header   X-Correlation-ID $correlation_id;
        }

        location ~ ^/users/([^/]+)/(followers|following)$ {
            proxy_pass         http://social_service;
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header   X-Correlation-ID $correlation_id;
        }

        # ── ActivityService ──────────────────────────────────────────────────
        location /history {
            proxy_pass         http://activity_service/history;
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header   X-Correlation-ID $correlation_id;
        }

        location /watchlist {
            proxy_pass         http://activity_service/watchlist;
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header   X-Correlation-ID $correlation_id;
        }

        location /playlists {
            proxy_pass         http://activity_service/playlists;
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header   X-Correlation-ID $correlation_id;
        }

        # ── FeedService (HTTP) ───────────────────────────────────────────────
        location /feed {
            proxy_pass         http://feed_service/feed;
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header   X-Correlation-ID $correlation_id;
        }

        # ── FeedService (WebSocket) ──────────────────────────────────────────
        location /ws/feed {
            proxy_pass              http://feed_service/ws/feed;
            proxy_http_version      1.1;
            proxy_set_header        Upgrade          $http_upgrade;
            proxy_set_header        Connection       $connection_upgrade;
            proxy_set_header        Host             $host;
            proxy_set_header        X-Real-IP        $remote_addr;
            proxy_read_timeout      3600s;
            proxy_send_timeout      3600s;
        }

        # ── Swagger (dev) ────────────────────────────────────────────────────
        location /swagger/users/ {
            proxy_pass http://user_service/swagger/;
        }
        location /swagger/catalogue/ {
            proxy_pass http://catalogue_service/swagger/;
        }
        location /swagger/reviews/ {
            proxy_pass http://review_service/swagger/;
        }
        location /swagger/social/ {
            proxy_pass http://social_service/swagger/;
        }
        location /swagger/activity/ {
            proxy_pass http://activity_service/swagger/;
        }
        location /swagger/feed/ {
            proxy_pass http://feed_service/swagger/;
        }
    }
}