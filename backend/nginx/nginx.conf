worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"bytes_sent":$body_bytes_sent,'
            '"duration":$request_time,'
            '"upstream":"$upstream_addr",'
            '"correlation_id":"$http_x_correlation_id"'
        '}';

    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    # ─────────────────────────────────────────────
    # Docker service discovery (ВАЖНО)
    # ─────────────────────────────────────────────

    upstream user_service {
        server user-service:8080;
    }

    upstream catalogue_service {
        server catalogue-service:8080;
    }

    upstream review_service {
        server review-service:8080;
    }

    upstream social_service {
        server social-service:8080;
    }

    upstream activity_service {
        server activity-service:8080;
    }

    upstream feed_service {
        server feed-service:8080;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        set $correlation_id $http_x_correlation_id;
        if ($correlation_id = "") {
            set $correlation_id $request_id;
        }

        add_header X-Correlation-ID $correlation_id always;

        root /usr/share/nginx/html;
        index index.html;

        location /api/ping {
            return 200 "pong\n";
            add_header Content-Type text/plain;
        }

        # ── UserService ─────────────────────────────
        location /api/users/ {
            proxy_pass http://user_service/users/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Correlation-ID $correlation_id;
        }

        # ── CatalogueService ────────────────────────
        location /api/movies {
            proxy_pass http://catalogue_service/movies;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Correlation-ID $correlation_id;
        }

        # ── ReviewService ───────────────────────────
        location /api/reviews {
            proxy_pass http://review_service/reviews;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Correlation-ID $correlation_id;
        }

        # ── SocialService ───────────────────────────
        location /api/follow {
            proxy_pass http://social_service/follow;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Correlation-ID $correlation_id;
        }

        location ~ ^/api/users/([^/]+)/(followers|following)$ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://social_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Correlation-ID $correlation_id;
        }

        # ── ActivityService ─────────────────────────
        location /api/history {
            proxy_pass http://activity_service/history;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Correlation-ID $correlation_id;
        }

        location /api/watchlist {
            proxy_pass http://activity_service/watchlist;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Correlation-ID $correlation_id;
        }

        location /api/playlists {
            proxy_pass http://activity_service/playlists;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Correlation-ID $correlation_id;
        }

        # ── FeedService ─────────────────────────────
        location /api/feed {
            proxy_pass http://feed_service/feed;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Correlation-ID $correlation_id;
        }

        # WebSocket
        location /api/ws/feed {
            proxy_pass http://feed_service/ws/feed;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Swagger
        location /api/swagger/users/ {
            proxy_pass http://user_service/swagger/;
        }
        location /api/swagger/catalogue/ {
            proxy_pass http://catalogue_service/swagger/;
        }
        location /api/swagger/reviews/ {
            proxy_pass http://review_service/swagger/;
        }
        location /api/swagger/social/ {
            proxy_pass http://social_service/swagger/;
        }
        location /api/swagger/activity/ {
            proxy_pass http://activity_service/swagger/;
        }
        location /api/swagger/feed/ {
            proxy_pass http://feed_service/swagger/;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
