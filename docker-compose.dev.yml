version: "3.9"
services:
  user-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"

  catalogue-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: catalogue
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
    ports:
      - "5433:5432"

  review-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reviews
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
    ports:
      - "5434:5432"

  social-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: social
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
    ports:
      - "5435:5432"

  activity-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: activity
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
    ports:
      - "5436:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123

  nginx:
    image: nginx:1.25-alpine
    container_name: cinegram-nginx
    ports:
      - "80:80"
    volumes:
      - C:/cinegram-nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
